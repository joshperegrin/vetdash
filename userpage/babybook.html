        <!--Hero-section-->
        <section class="container mt-5">
            
        <div class="col-12 col-sm-4 mb-3 mx-3 form-container p-sm-3">
            <label for="ownerName" class="form-label">Pet ID: </label>
            <input type="text" class="form-control-sm" id="ownerName_Forms" name="ownerName_Forms" placeholder="Enter Pet ID">
            
            <button type="submit" class="btn btn-secondary btn-sm mb" >Submit</button>
            
          </div>
        </div>
        
        
            <br>

        <section class="container mt-4">
            <div class="form-container p-3">
              <h3 class="form-section-title mx-3 p-3">Baby book</h3>
              <form>
                <div class="mb-3 mx-5">
                  <label for="ownerName" class="form-label">Owner Name: </label>
                  <p><strong>Owner Name:</strong> <span id="ownerName_Forms"></span></p>
                  <p><strong>Pet Name:</strong> <span id="petName_Forms"></span></p>
                  <p><strong>Date of Birth:</strong> <span id="dateOfBirth_Forms"></span></p>
                  <p><strong>Gender:</strong> <span id="petGender_Forms"></span></p>
                  <p><strong>Species:</strong> <span id="petSpecies_Forms"></span></p>
                  <p><strong>Breed:</strong> <span id="petBreed_Forms"></span></p>
                  <p><strong>Preferred Vet:</strong> <span id="preferredVet_Forms"></span></p>
                  <p><strong>Reason for Visit:</strong> <span id="preferredVet_Forms"></span></p>
                  <p><strong>Schedule:</strong> <span id="preferredVet_Forms"></span></p>
                </div>
              </div>
            
           
                </div>
                <div class="mb-3 mx-5">
                  <label for="ownerEmail" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="ownerEmail_Forms" name="ownerEmail_Forms" placeholder="Enter email address">
                </div>
                <div class="mb-3 mx-5">
                  <label for="ownerContact" class="form-label">Contact Number</label>
                  <input type="text" class="form-control" id="ownerContact_Forms" name="ownerContact_Forms" placeholder="Enter contact number">
                </div>
                <div class="mb-3 mx-5">
                  <label for="ownerAddress" class="form-label">Address</label>
                  <input type="text" class="form-control" id="ownerAddress_Forms" name="ownerAddress_Forms" placeholder="Enter address">
                </div>

              </form>
            </div>
            <div class="form-container p-3">
              <h3 class="form-section-title mx-3 p-3">Pet Details</h3>
              <form>
                <div class="mb-3 mx-5">
                  <label for="petName" class="form-label">Pet Name</label>
                  <input type="text" class="form-control" id="petName_Forms" name="petName_Forms" placeholder="Enter pet name">
                </div>
                <div class="mb-3 mx-5">
                  <label for="dateOfBirth" class="form-label">Pet Date of Birth</label>
                  <input type="date" class="form-control" id="dateOfBirth_Forms" name="dateOfBirth_Forms">
                </div>
                <div class="mb-3 mx-5">
                  <label for="petGender" class="form-label">Pet Gender</label>
                  <select class="form-control" id="petGender_Forms" name="petGender_Forms">
                    <option value="">Select gender</option>
                    <option value="true">Male</option>
                    <option value="false">Female</option>
                  </select>
                </div>
