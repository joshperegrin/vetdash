<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="stylesheet.css" rel="stylesheet">

</head>

  <body class="container-fluid p-0">
    <!--NavBar-->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="images/logo.png" alt="Logo" width="35" height="35" class="d-inline-block align-text-top"> 
            VetDash
        </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
                <img src="images/logo.png" alt="Logo" width="35" height="35" class="d-inline-block align-text-top"> 
                VetDash
            </h5>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-left flex-grow-1 pe-3">
                    <li class="nav-item">
                      <a class="nav-link mx-lg-2" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link mx-lg-2" href="aboutUs.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link mx-lg-2" href="petteam.html">Pet Team</a>
                      </li>
                    <li class="nav-item"> 
                        <a class="nav-link mx-lg-2" href="book.html" > Book </a>
                    </li>
                    <li class="nav-item"> 
                        <a class="nav-link active mx-lg-2" aria-current="page" href="babybook.html" > Baby Book </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </nav>

        <!--End of NavBar-->


        <!--Hero-section-->
        <section class="container mt-5">
          <div class="col-12 col-sm-4 mb-3 mx-3 form-container p-sm-3">
              <label for="petID_Input" class="form-label">Pet ID: </label>
              <input type="text" class="form-control-sm" id="petID_Input" name="petID_Input" placeholder="Enter Pet ID">
              <button type="submit" class="btn btn-secondary btn-sm mb" id="fetchButton">Submit</button>
          </div>
      </section>
      
      <br>
      
      <section class="container mt-4">
          <div class="form-container p-3">
              <h3 class="form-section-title mx-3 p-3">Baby Book</h3>
              <div class="mb-3 mx-5">
                  <p><strong>Owner Name:</strong> <span id="ownerName_Forms"></span></p>
                  <p><strong>Pet Name:</strong> <span id="petName_Forms"></span></p>
                  <p><strong>Date of Birth:</strong> <span id="dateOfBirth_Forms"></span></p>
                  <p><strong>Gender:</strong> <span id="petGender_Forms"></span></p>
                  <p><strong>Species:</strong> <span id="petSpecies_Forms"></span></p>
                  <p><strong>Breed:</strong> <span id="petBreed_Forms"></span></p>
                  <p><strong>Preferred Vet:</strong> <span id="preferredVet_Forms"></span></p>
                  <p><strong>Reason for Visit:</strong> <span id="visitReason_Forms"></span></p>
                  <p><strong>Schedule:</strong> <span id="dateTime_Forms"></span></p>
                  <p><strong>Status: </strong> <span id="status"></span></p> 
                 

          </div>
      </section>

     <!--HISTORY / previous appointments-->
    
          <section class="container mt-4">
            <div class="form-container p-3">
               <h3 class="form-section-title mx-3 p-3">Past Appointments</h3>
            <div id="historyContainer" class="mb-3 mx-5">
              <!-- Past appointments will be dynamically inserted here -->
          </div>
      </div>
  </section>

              
                
         
              
      <!--End of Hero-Section-->
        
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="babybook.js"></script>
  
  </body>
</html>
