<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

              <img src="images/logo.png" alt="Logo" width="35" height="35" class="d-inline-block align-text-top">
              VetDash

            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>

    <!-- Booking Form -->
    <section class="container mt-4">
      <div class="form-container p-3">
        <h3 class="form-section-title mx-3 p-3">Pet Owner Information</h3>
        <form>
          <div class="mb-3 mx-5">
            <label for="ownerName" class="form-label">Name</label>
            <input type="text" class="form-control" id="ownerName_Forms" name="ownerName_Forms" placeholder="Enter Name">
          </div>
          <div class="mb-3 mx-5">
            <label for="ownerEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="ownerEmail_Forms" name="ownerEmail_Forms" placeholder="Enter email address">
          </div>
          <div class="mb-3 mx-5">
            <label for="ownerContact" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="ownerContact_Forms" name="ownerContact_Forms" placeholder="Enter contact number" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
          </div>
          <div class="mb-3 mx-5">
            <label for="ownerAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="ownerAddress_Forms" name="ownerAddress_Forms" placeholder="Enter address">
          </div>
        </form>
      </div>
      <div class="form-container p-3">
        <h3 class="form-section-title mx-3 p-3">Pet Details</h3>
        <form>
          <div class="mb-3 mx-5">
            <label for="petName" class="form-label">Pet Name</label>
            <input type="text" class="form-control" id="petName_Forms" name="petName_Forms" placeholder="Enter pet name">
          </div>
          <div class="mb-3 mx-5">
            <label for="dateOfBirth" class="form-label">Pet Date of Birth</label>
            <input type="date" class="form-control" id="dateOfBirth_Forms" name="dateOfBirth_Forms">
          </div>
          <div class="mb-3 mx-5">
            <label for="petGender" class="form-label">Pet Gender</label>
            <select class="form-control" id="petGender_Forms" name="petGender_Forms">
              <option value="">Select gender</option>
              <option value="true">Male</option>
              <option value="false">Female</option>
            </select>
          </div>
          <div class="mb-3 mx-5">
            <label for="petSpecies" class="form-label">Pet Species</label>
            <input type="text" class="form-control" id="petSpecies_Forms" name="petSpecies_Forms" placeholder="Enter pet species">
          </div>
          <div class="mb-3 mx-5">
            <label for="petBreed" class="form-label">Pet Breed</label>
            <input type="text" class="form-control" id="petBreed_Forms" name="petBreed_Forms" placeholder="Enter pet breed">
          </div>
          <div class="mb-3 mx-5">
            <label for="petID" class="form-label">Pet ID</label>
            <input type="text" class="form-control" id="petID_Forms" name="petID_Forms" placeholder="Pet ID">
          </div>
        </form>
      </div>
      <div class="form-container p-3">
        <h3 class="form-section-title mx-3 p-3">Visit Details</h3>
        <form>
          <div class="mb-3 mx-5">
            <label for="preferredVet" class="form-label">Preferred Vet</label>
            <select class="form-control" id="preferredVet_Forms" name="preferredVet_Forms" onchange="constructDatePicker()">
          </select>
          </div>
          <div>
            <div class="container-fluid"style="height: auto; width: 400px;">
              <div class="text-center mb-2">Select Schedule</div>
              <div class="mb-3 text-center">
                <span class="badge bg-secondary text-light mx-1">No Color - Unavailable</span>
                <span class="badge bg-danger text-light mx-1">Red - Fully Booked</span>
                <span class="badge bg-success text-light mx-1">Green - Available</span>
                <span class="badge bg-primary text-light mx-1">Blue - Chosen Date</span>
              </div>
              <div id="month_label" class="fs-6 text-center"></div>
              <div class="container-fluid p-3" style="height: 250px; width: 350px;">
                <div class="row h-25">
                  <div class="col p-1"><button type="button" id="calendar_picker_0" onclick="selectDate(0)" class="w-100 h-100"> 1 </button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_1" onclick="selectDate(1)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_2" onclick="selectDate(2)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_3" onclick="selectDate(3)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_4" onclick="selectDate(4)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_5" onclick="selectDate(5)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_6" onclick="selectDate(6)" class="w-100 h-100"></button></div>
                </div>
                <div class="row h-25">
                  <div class="col p-1"><button type="button" id="calendar_picker_7" onclick="selectDate(7)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_8" onclick="selectDate(8)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_9" onclick="selectDate(9)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_10" onclick="selectDate(10)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_11" onclick="selectDate(11)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_12" onclick="selectDate(12)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_13" onclick="selectDate(13)" class="w-100 h-100"></button></div>
                </div>
                <div class="row h-25">
                  <div class="col p-1"><button type="button" id="calendar_picker_14" onclick="selectDate(14)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_15" onclick="selectDate(15)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_16" onclick="selectDate(16)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_17" onclick="selectDate(17)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_18" onclick="selectDate(18)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_19" onclick="selectDate(19)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_20" onclick="selectDate(20)" class="w-100 h-100"></button></div>
                </div>
                <div class="row h-25">
                  <div class="col p-1"><button type="button" id="calendar_picker_21" onclick="selectDate(21)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_22" onclick="selectDate(22)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_23" onclick="selectDate(23)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_24" onclick="selectDate(24)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_25" onclick="selectDate(25)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_26" onclick="selectDate(26)" class="w-100 h-100"></button></div>
                  <div class="col p-1"><button type="button" id="calendar_picker_27" onclick="selectDate(27)" class="w-100 h-100"></button></div>
                </div>
              </div>
            </div>
          </div>
          <div class="mb-3 mx-5">
            <label for="visitReason" class="form-label">Reason for Visit</label>
            <select class="form-control" id="visitReason_Forms" name="visitReason_Forms" placeholder="Enter Reason for Visit">
              <option value="Consultation and Checkup">Consultation and Checkup</option>
              <option value="Vaccination and Deworming">Vaccination and Deworming</option>
              <option value="Pet Grooming">Pet Grooming</option>
              <option value="Pet Boarding">Pet Boarding</option>
              <option value="Ultrasound">Ultrasound</option>
              <option value="Digital X-ray">Digital X-ray</option>
              <option value="Laser Therapy">Laser Therapy</option>
            </select>
          </div>
          <div class="mb-3 mx-5">
            <label for="otherConcerns" class="form-label">Other Concerns</label>
            <textarea class="form-control" id="otherConcerns_Forms" name="otherConcerns_Forms"></textarea>
          </div>
        </form>
        <button class="btn btn-secondary" id="addAppointmentBtn">Add Appointment</button>
      </div>
    </section>
    <!-- End of Booking Form -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="book.js"></script>
  </body>
</html>
