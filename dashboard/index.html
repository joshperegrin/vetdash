<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Dash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="app" class="container-fluid">
        <div class="row flex-nowrap">
            <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark min-vh-100" style="width: 200px;">
                <a href="/" class="d-flex align-items-center my-2  text-white text-decoration-none">
                    <img src="./assets/vet (1) 2.png" />
                    <span class="fs-4">Vet Dash</span>
                </a>
                <hr>
                <ul class="nav nav-pills flex-column mb-auto gap-3">
                    <li>
                        <button @click="currentPage='overview'" class="nav-link text-white fs-6">
                            <i class="bi bi-grid me-2"></i>
                            Overview
                        </button>
                    </li>
                    <li>
                        <button @click="currentPage='appointments'" class="nav-link text-white fs-6">
                            <i class="bi bi-calendar-minus me-2"></i>
                            Appointments
                        </button>
                    </li>
                    <li>
                        <button @click="currentPage='vetSched'" class="nav-link text-white fs-6">
                            <i class="bi bi-person-check-fill me-2"></i>
                            Vet Schedule
                        </button>
                    </li>
                    <li>
                        <button @click="currentPage='settings'" class="nav-link text-white fs-6">
                            <i class="bi bi-gear-fill me-2"></i>
                            Settings
                        </button>
                    </li>
                </ul>
                <hr>
                <div class="px-2">
                    <button class="nav-link text-white fs-6">
                        <i class="bi bi-gear-fill me-2"></i>
                        Settings
                    </button>
                </div>
            </div>
            <div class="col d-flex flex-column mt-4 mx-4 mb-4">
                <div v-if="currentPage=='overview'" class="d-flex flex-column">
                    <div class="h3">Overview</div>
                </div>
                <div v-if="currentPage=='appointments'" class="d-flex flex-column flex-grow-1">
                    <div class="h3">Appointments</div>
                    <div class="fs-6 pb-3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Magnam, sit</div>
                    <div class="card d-flex flex-grow-1">
                        <div class="card-header d-flex flex-row justify-content-between">
                            <button class="btn btn-outline-primary btn-sm text-nowrap"> <i class="bi bi-plus-circle-dotted"></i> Add Appointments</button>
                            <div class="d-flex flex-row align-items-center gap-3">
                                <input placeholder="Search Appointments" @change="fetchQuery()" v-model="appointmentSearchTerm" type="text" class="form-control form-control-sm">
                                <select v-model="appointmentSearchFilter" class="form-select-sm " style="width: 150px;" id="select-filters">
                                    <option value="appointmentID">Appointment ID </option>
                                    <option value="dateTime">Date Scheduled</option>
                                    <option value="createdAt">Date Created</option>
                                    <option value="ownerName">Owner Name</option>
                                    <option value="ownerEmail">Owner Email</option>
                                    <option value="ownerContact">Owner Number</option>
                                    <option value="preferredVet">Vet Booked</option>
                                    <option value="status">Status</option>
                                    <option value="petID">Pet ID </option>
                                    <option value="breed">Pet Breed</option>
                                    <option value="species">Pet Species</option>
                                    <option value="dateOfBirth">Pet Birth Date</option>
                                    <option value="petName">Pet Name</option>
                                </select>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                        id="switch-calendar_list">
                                </div>
                            </div>
                        </div>
                        <div class="card-body d-flex flex-column">
                            Search Term: "{{appointmentSearchTerm}}" <br> Search Filter: "{{appointmentSearchFilter}}"
                            <div v-for="appointment in appointmentlist"> {{appointment}} </div>
                        </div>
                        <div class="card-footer">PAGES</div>
                    </div>
                </div>
                <div v-if="currentPage=='vetSched'" class="d-flex flex-column">
                    <div class="h3">Vet Schedules</div>
                </div>
                <div v-if="currentPage=='settings'" class="d-flex flex-column">
                    <div class="h3">Settings</div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="./js/main.js"></script>

</body>

</html>
