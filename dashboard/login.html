<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script defer type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
        
        const firebaseConfig = {
            apiKey: "AIzaSyCn5TPno8hTc1cM-Sm9vsrzkJn6VjKTyYM",
            authDomain: "vet-appointment-3a67a.firebaseapp.com",
            projectId: "vet-appointment-3a67a",
            storageBucket: "vet-appointment-3a67a.firebasestorage.app",
            messagingSenderId: "136329434663",
            appId: "1:136329434663:web:ad3507ceff4fc664072002",
            measurementId: "G-8LEBWB9T8G"
        };
        
        const firebaseApp = initializeApp(firebaseConfig);
        console.log(firebaseApp)
        const auth = getAuth(firebaseApp);
        console.log(auth)


        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Redirect to login page if not logged in
                window.location.href = "./index.html";
            }
        });
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "./index.html"; // Redirect to dashboard
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        }
        window.login = login;
    </script>
    <style>
        .btn-ky {
            background-color: #958C8C;
        }
        .btn-ky:hover {
            background-color: #8B8383;
        }
        .btn-ky:active {
            background-color: #696363 !important;
        }
    </style>
</head>
<body class="container-fluid">
    <div class="row vh-100">
        <div class="col w-25 d-flex flex-column align-items-center justify-content-center p-5 min-vh-100">
            <img src="./assets/vet (1) 1.png" class="mb-3" style="height: 200px; width:auto"/>
            <h2 class="mb-3">VetDash Dashboard</h2>
            <form onsubmit="event.preventDefault(); login();" class="w-75 px-5">
                <label class="form-label" for="email" >Email:</label>
                <input class="form-control mb-2" type="email" id="email" required>
                <label class="form-label" for="password">Password:</label>
                <input class="form-control mb-3" type="password" id="password" required>
                <br>
                <button class="btn btn-ky fw-bold text-white w-100"type="submit">Login</button>
            </form>
        </div>
        <div class="col w-75 h-100 d-flex justify-content-center align-items-center overflow-hidden">
            <img src="./assets/vet-dashboard-imgcover.jpg" alt="lmao" class="img-fluid h-100" style="object-fit: cover; width: 100%;"/>
        </div>
    </div>
    
</body>
</html>
